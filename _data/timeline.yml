- year: 2020
  title: Mountain Trip in Late Autumn
  description:
    - "In late autumn, QingCheng Mountain is quiet and verdant. Walking in the forest, the brook sounds like a harp, the breeze blow over the gold, red, and green leaves, just like a beautiful painting. I love the scenery, and this is the sound of the forest."
  youtube_id: ORhe8v69KXM

- year: 2021
  title: Battle of Gai Xia
  description:
    - "<p>The Battle of GaiXia was a last stand fought during the Chu-Han Contention between the forces of Liu Bang and Xiang Yu.</p> 
      <p>This historical event inspired me to write this new piece. With the blending of classical Chinese instruments and orchestra, the piece shows the grand scene of the battle, heroic figures, their ambition of victory and unifying the country, also my admiration for the spirit of fighting for the ideals.</p>"
  youtube_id: tR0hm4qE8uI
  youtube_start: 625
  
- year: 2022
  title: Battlefield Muster
  description:
    - "<p>This piece is inspired by a poem “Po Zhen Zi: To Chen Tongfu” written by Xin Qiji, a Chinese famous poet in Song Dynasty.</p> 
      <p>“The music played with Guqin is exciting and magnificent, battlefield troops were mustered in autumn”, the piece is about the scene before the war, when the soldiers were mustered on the battlefield. It shows their lofty aspirations and patriotic belief.</p>"
  youtube_id: k3hzMnHJtYg
  youtube_start: 3393
