- year: 2015
  title: Spring Dance
  description:
    - "<p>When spring comes, the birds sing, the butterflies dance, the flowers boom, the trees turn green. Spring is the most beautiful season! And more important, Chinese Spring Festival is also in spring.</p> 					
      <p>I love spring! This piece is Chinese pentatonic mode. I hope it can make you feel cheerful and happy! Join me to the fun world and enjoy the beautiful music!</p>"
  youtube_id: ''

- year: 2016
  title: Beautiful Hui Teng Xi Le
  description:
    - "I went to one of the most beautiful grassland in China, called Hui Teng Xi Le in the summer of 2014. The sky there was so blue and clear, with snow-white clouds. The air was very fresh. I was so happy that I ran and rode on the grassland. The joyful bonfire party and splendid sunrise impressed me most!  I'd like to express how grateful and touched I was with the wonderful music."
  youtube_id: BAqfoMv-iL0

- year: 2017
  title: Dream · Adventure
  description:
    - "<p>I had a dream in which Mr. Inomoto, Mrs Chenbing, my friends and I went to the concert. While on our way there, we met the foreign robbers who shot at our car. Being scared, we ran about madly even through Arab, and finally arrived safely at the concert. </p>
      <p>The whole dream was full of magic and fantasy, I want to express my feelings in the dream to the music.</P>"
  youtube_id: 3o9mIikAg3o
  youtube_start: 884

- year: 2018
  title: Skyline
  description:
    - "<p>Once, gazing out of an airplane window, I saw a sea of clouds in the air. How wonderful our nature is!</p> 
      <p>I recorded the beautiful moment with my Ipad, and was inspired to write music about the sky and nature's grandeur.</p>"
  youtube_id: js_19-RCNJU

